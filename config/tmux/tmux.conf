unbind C-b
set -g prefix C-a
set -g mouse on
set -g set-clipboard on
setw -g mode-keys vi

bind-key ` last-window
bind-key e send-prefix

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set-option -g set-titles on
set-option -g history-limit 100000
set -g default-terminal 'xterm-256color'

# Status bar follows the terminal's light/dark colours. tmux 3.8 detects the
# client theme and swaps the theme* colours, so nothing is hard-coded here.
set -g status-position bottom
set -g status-style 'bg=default,fg=default'
set -g status-left ''
set -g status-right '#[dim] %d/%m #[nodim,reverse,bold] %H:%M:%S #[default]'
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-style 'fg=default,dim'
setw -g window-status-current-style 'fg=default,bold'
setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-format ' #I:#W#[fg=themecyan]#F '

set -g @yank_action 'copy-pipe'

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tpm'

run '~/.tmux/plugins/tpm/tpm'

